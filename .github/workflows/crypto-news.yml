name: CI

# The bot runs 24/7 on Render. This workflow is a quick check on push / PR /
# manual trigger so we catch syntax, import or regression errors before deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile src/*.py
      - name: Import smoke test
        working-directory: src
        run: python -c "import bot, news, twitter, storage, ai_summary; print('imports ok')"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
